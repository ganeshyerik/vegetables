      function renderTable(data) {
        const tbody = document.querySelector("#vegTable tbody");
        tbody.innerHTML = "";
        data.forEach(veg => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><img class="veg-img" src="${veg.image}" alt="${veg.name}"></td>
            <td>${veg.name}</td>
            <td>${veg.price}</td>
            <td>${veg.availableKg}</td>
          `;
          tbody.appendChild(tr);
        });
      }
